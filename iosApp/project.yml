# Generates iosApp.xcodeproj: `cd iosApp && xcodegen`. The .xcodeproj is not committed.
name: iosApp
options:
  bundleIdPrefix: com.houseaffairs
  deploymentTarget:
    iOS: "15.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # GitLive firebase-kotlin-sdk 2.1.0 is built against Firebase iOS 11.1.
    from: 11.1.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: HouseAffairs
        UILaunchScreen: {}
        # Compose Multiplatform needs this for 120 Hz on ProMotion screens.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Google sign-in returns to the app through its reversed client id (REVERSED_CLIENT_ID in
        # GoogleService-Info.plist), set below per Firebase project.
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["$(GOOGLE_REVERSED_CLIENT_ID)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.houseaffairs.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "ComposeApp", "-ObjC"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        # REVERSED_CLIENT_ID from GoogleService-Info.plist (Firebase project houseaffairs-98d6a).
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.456375372275-d5fp6277hh15i1k7njgmgbgug3v6cuf6
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
